<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daydream — Plan anything</title>
<style>
:root{--bg:#f6f7fc;--panel:#fff;--ink:#252b43;--muted:#8188a3;--line:#e8eaf3;--accent:#6f83df;--accent2:#a6b7ff;--soft:#edf1ff;--pink:#f7e9f6;--mint:#e6f5ef;--peach:#fff0e5;--shadow:0 12px 34px rgba(44,58,100,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{display:flex;min-height:100vh}.sidebar{width:244px;background:#fff;border-right:1px solid var(--line);padding:26px 18px;display:flex;flex-direction:column;gap:28px;flex-shrink:0}
.brand{display:flex;align-items:center;gap:11px;font-size:20px;font-weight:800;letter-spacing:-.5px;padding:2px 8px}.logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#7d92ed,#b5c2ff);display:grid;place-items:center;color:white;font-size:18px}
.nav-label{font-size:10px;letter-spacing:1.6px;color:#a0a5b9;font-weight:800;margin:0 10px 9px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;text-align:left;color:#737b96;padding:11px 12px;border-radius:12px;cursor:pointer;font-size:14px;font-weight:600;display:flex;gap:11px;align-items:center}.nav button.active,.nav button:hover{background:var(--soft);color:#536dcf}.nav-icon{width:20px;text-align:center;font-size:16px}.side-bottom{margin-top:auto}.mini-note{background:linear-gradient(140deg,#eef2ff,#f8effb);border-radius:16px;padding:15px;font-size:12px;color:#747e9d;line-height:1.5}.mini-note strong{display:block;color:#4e5fba;margin-bottom:5px}
.main{flex:1;min-width:0;padding:30px 36px 44px;max-width:1450px;margin:auto}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:27px;gap:15px}.welcome h1{font-size:26px;margin:0 0 6px;letter-spacing:-.7px}.welcome p{margin:0;color:var(--muted);font-size:14px}.top-actions{display:flex;gap:10px;align-items:center}.search{background:white;border:1px solid var(--line);border-radius:12px;padding:10px 13px;color:var(--muted);display:flex;gap:8px;align-items:center;min-width:210px}.search input{border:0;outline:0;background:transparent;width:100%;font-size:13px}
.button{border:0;border-radius:12px;padding:11px 15px;background:var(--accent);color:white;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 5px 14px rgba(111,131,223,.2)}.button:hover{filter:brightness(1.04)}.button.secondary{background:#fff;color:#6173c7;border:1px solid var(--line);box-shadow:none}
.hero{background:linear-gradient(120deg,#8296ef,#a9b9ff 55%,#d4c8f5);border-radius:23px;padding:25px 28px;color:white;display:flex;align-items:center;justify-content:space-between;min-height:178px;overflow:hidden;position:relative;margin-bottom:24px}.hero:after{content:"✦  ✧  ✦";position:absolute;right:20%;top:23px;font-size:22px;opacity:.4}.hero h2{font-size:24px;margin:0 0 9px;letter-spacing:-.5px}.hero p{margin:0 0 18px;color:#f7f8ff;font-size:13px;max-width:440px;line-height:1.55}.hero .button{background:white;color:#6278d5;box-shadow:none}.hero-art{font-size:78px;opacity:.9;transform:rotate(-8deg);margin:0 45px 0 10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:25px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:17px 18px;box-shadow:var(--shadow)}.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.stat-emoji{width:31px;height:31px;border-radius:10px;background:var(--soft);display:grid;place-items:center}.stat-number{font-size:25px;font-weight:800;margin:10px 0 3px}.stat-caption{font-size:11px;color:var(--muted)}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:24px 0 14px}.section-head h2{font-size:17px;margin:0}.section-head a{color:#7185d8;font-size:12px;text-decoration:none;font-weight:700;cursor:pointer}
.filters{display:flex;gap:8px;flex-wrap:wrap}.filter{border:1px solid var(--line);background:#fff;color:#7b829b;padding:8px 12px;border-radius:20px;font-size:12px;cursor:pointer}.filter.active{background:var(--soft);color:#5b71ce;border-color:#dfe5ff}
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.plan-card{background:white;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);transition:transform .18s}.plan-card:hover{transform:translateY(-3px)}.plan-cover{height:130px;display:flex;align-items:center;justify-content:center;font-size:48px;position:relative}.cover-trip{background:linear-gradient(130deg,#e4edff,#c6d9ff)}.cover-event{background:linear-gradient(130deg,#ffe9f1,#f6cce4)}.cover-outing{background:linear-gradient(130deg,#dff6ed,#c5ead9)}.cover-other{background:linear-gradient(130deg,#fff0dc,#ffe0b9)}.plan-cover .cover-tag{position:absolute;left:13px;top:12px;background:#ffffffc9;color:#6f7895;padding:6px 9px;border-radius:20px;font-size:10px;font-weight:800;letter-spacing:.2px}.plan-content{padding:15px}.plan-title{font-size:15px;font-weight:800;margin:0 0 7px}.plan-desc{font-size:12px;color:var(--muted);margin:0 0 14px;line-height:1.45}.plan-meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#8990a7;border-top:1px solid #f0f1f6;padding-top:11px}.plan-meta .date{font-weight:700;color:#6c78a1}.empty{padding:36px;text-align:center;color:var(--muted);background:white;border-radius:16px;border:1px dashed var(--line);grid-column:1/-1}
.bottom-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-top:25px}.widget{background:white;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.widget h3{font-size:15px;margin:0 0 15px}.timeline{display:grid;gap:12px}.timeline-item{display:flex;gap:12px;align-items:center}.datebox{width:43px;height:45px;border-radius:12px;background:var(--soft);display:grid;place-items:center;align-content:center;color:#6379d2;flex-shrink:0}.datebox b{font-size:15px}.datebox small{font-size:9px;font-weight:800}.timeline-text b{font-size:12px;display:block;margin-bottom:3px}.timeline-text span{font-size:11px;color:var(--muted)}.checklist{display:grid;gap:11px}.checkline{display:flex;gap:10px;align-items:center;font-size:12px;color:#6e7690}.checkline input{accent-color:#7388de}.checkline.done span{text-decoration:line-through;color:#a3a8b9}

.journal-section{margin-top:27px}.journal-layout{display:grid;grid-template-columns:1.35fr .85fr;gap:16px}.journal-board,.journal-form-panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.journal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.memory-card{border:1px solid var(--line);border-radius:15px;overflow:hidden;background:#fff}.memory-image{width:100%;height:145px;object-fit:cover;background:linear-gradient(130deg,#e5edff,#f0e5fb);display:block}.memory-image.placeholder{display:grid;place-items:center;font-size:40px}.memory-body{padding:13px}.memory-title{font-size:14px;font-weight:800;margin:0 0 6px}.memory-date{font-size:10px;color:#7183d5;font-weight:700;margin-bottom:8px}.memory-text{font-size:12px;color:var(--muted);line-height:1.5;white-space:pre-wrap}.memory-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}.memory-tag{font-size:10px;background:var(--soft);color:#6479cf;padding:5px 8px;border-radius:15px}.journal-form-panel{background:linear-gradient(145deg,#f4f1ff,#edf2ff)}.journal-form-panel h3{margin:0 0 7px;font-size:16px}.journal-form-panel p{margin:0 0 15px;color:var(--muted);font-size:12px}.journal-form-panel textarea{width:100%;min-height:100px;resize:vertical;border:1px solid #e1e5f7;border-radius:12px;padding:12px;font:inherit;font-size:13px;outline:none;background:#ffffffd9;color:var(--ink)}.journal-form-panel input,.journal-form-panel select{width:100%;border:1px solid #e1e5f7;border-radius:10px;padding:10px;font:inherit;font-size:12px;background:#ffffffd9;color:var(--ink)}.journal-fields{display:grid;gap:10px;margin:12px 0}.photo-pick{display:flex;align-items:center;justify-content:center;gap:8px;border:1px dashed #b7c3f4;border-radius:11px;padding:11px;background:#fff8;color:#667bce;font-size:12px;cursor:pointer}.photo-pick input{display:none}.photo-preview{max-width:100%;max-height:120px;object-fit:cover;border-radius:10px;display:none;margin-top:9px}.journal-empty{grid-column:1/-1;padding:26px;text-align:center;color:var(--muted);font-size:12px;border:1px dashed var(--line);border-radius:14px}.memory-delete{border:0;background:transparent;color:#9aa0b6;font-size:11px;cursor:pointer;margin-top:9px}.memory-delete:hover{color:#c26d8a}
@media(max-width:850px){.journal-layout{grid-template-columns:1fr}.journal-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.journal-grid{grid-template-columns:1fr}}

.modal-backdrop{position:fixed;inset:0;background:#20294365;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal-backdrop.open{display:flex}.modal{background:white;width:min(480px,100%);border-radius:20px;padding:24px;box-shadow:0 25px 70px #18203d35}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modal-head h2{margin:0;font-size:19px}.close{border:0;background:#f2f4fa;border-radius:10px;width:32px;height:32px;cursor:pointer;font-size:17px}.field{display:grid;gap:7px;margin-bottom:13px}.field label{font-size:12px;font-weight:700;color:#69738f}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit;font-size:13px;outline:none;background:#fff;color:var(--ink)}.field textarea{resize:vertical;min-height:65px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}
footer{color:#a3a8b9;text-align:center;font-size:11px;margin:28px 0 0}
@media(max-width:1050px){.sidebar{width:205px}.main{padding:25px}.plans{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:740px){.app{display:block}.sidebar{width:auto;display:flex;flex-direction:row;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}.sidebar .nav-label,.side-bottom{display:none}.nav{display:flex;gap:3px}.nav button{padding:9px;font-size:0}.nav-icon{font-size:17px}.main{padding:20px 15px}.topbar{align-items:flex-start;flex-direction:column}.top-actions{width:100%}.search{flex:1;min-width:0}.hero{padding:22px;min-height:150px}.hero-art{font-size:52px;margin-right:5px}.hero h2{font-size:21px}.stats{gap:8px}.stat{padding:13px}.stat-number{font-size:22px}.plans{grid-template-columns:1fr}.bottom-grid{grid-template-columns:1fr}.welcome h1{font-size:23px}}
button{font-family:inherit}
*:focus-visible{outline:2px solid var(--accent)!important;outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hero-actions{display:flex;gap:8px;flex-wrap:wrap}.hero>div:first-child{min-width:0}.hero .button.secondary{background:#fff;color:#647bd5;border:0}
.welcome{min-width:0}.section-head h2 .sub{font-weight:600;color:var(--muted);font-size:12px;margin-left:6px}
.plan-card{position:relative}.plan-card:focus-within{transform:translateY(-3px)}.plan-title{margin:0 0 7px}.plan-open{all:unset;font-size:15px;font-weight:800;cursor:pointer;display:block}.plan-open::after{content:"";position:absolute;inset:0}.plan-open:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:18px}
.plan-meta{gap:10px}.plan-meta span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timeline-item{background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%;border-radius:12px}.timeline-text{display:block;min-width:0}
.checkline{justify-content:space-between}.checkline label{display:flex;gap:10px;align-items:center;flex:1;min-width:0;cursor:pointer}.checkline .task-del{border:0;background:transparent;color:#aab0c4;font-size:16px;cursor:pointer;line-height:1;padding:2px 6px;border-radius:8px}.checkline .task-del:hover{color:#c26d8a}
.add-task{margin-top:14px;display:flex;gap:8px}.add-task input{flex:1;min-width:0;border:1px solid var(--line);border-radius:9px;padding:9px;font:inherit;font-size:12px;color:var(--ink)}.add-task .button{padding:9px 12px}
.muted{font-size:12px;color:#9299ae;margin:0}
.cards-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.widget h3 .progress{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-top:4px}.link-title{all:unset;cursor:pointer;font-size:15px;font-weight:800}.link-title:hover{color:#536dcf}.link-title:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cal-controls{display:flex;gap:8px}.cal-controls .button{padding:9px 14px}
.calendar{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.cal-head,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.cal-head div{padding:10px 4px;text-align:center;font-size:10px;letter-spacing:1.2px;font-weight:800;color:#a0a5b9;border-bottom:1px solid var(--line)}
.cal-grid{gap:1px;background:var(--line)}.cal-cell{background:#fff;min-height:108px;padding:6px;display:flex;flex-direction:column;gap:5px;min-width:0;overflow:hidden}.cal-cell.out{background:#fafbfe}.cal-cell.out .cal-day{color:#b5bacb}.cal-cell.blank{cursor:pointer}.cal-cell.blank:hover{background:#f6f8ff}
.cal-day{border:0;background:transparent;width:26px;height:26px;border-radius:50%;font-size:12px;font-weight:700;color:#6c78a1;cursor:pointer;flex-shrink:0}.cal-day:hover{background:var(--soft)}.cal-cell.today .cal-day{background:var(--accent);color:#fff}
.cal-chips{display:flex;flex-direction:column;gap:3px;min-width:0}.cal-chip{display:flex;gap:5px;align-items:center;border:0;color:#4d5fb3;border-radius:8px;padding:3px 6px;font-size:11px;font-weight:700;cursor:pointer;min-width:0;text-align:left}.cal-chip .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cal-list{display:none;margin-top:16px}
.emoji-row{display:flex;flex-wrap:wrap;gap:6px}.emoji-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:18px;cursor:pointer;padding:0}.emoji-btn[aria-pressed=true]{background:var(--soft);border-color:var(--accent)}
.field .label{font-size:12px;font-weight:700;color:#69738f}.form-error{color:#c26d8a;font-size:12px;margin:0 0 8px;min-height:0}.form-error:empty{display:none}
.modal-backdrop{overflow:auto}.modal{max-height:calc(100vh - 36px);overflow:auto}.modal .plan-cover{height:110px;border-radius:14px;margin-bottom:16px}.modal-head h2{overflow-wrap:anywhere}.modal-head .close{flex-shrink:0;margin-left:10px}
.detail-line{margin:0 0 8px;font-size:13px;color:#69738f}.detail-line b{color:#536dcf}.detail-notes{margin:12px 0 18px;font-size:13px;line-height:1.55;color:var(--muted);white-space:pre-wrap}.modal h3{font-size:14px;margin:18px 0 12px}.modal h3 .progress{font-size:11px;font-weight:600;color:var(--muted);margin-left:6px}
.confirm-text{margin:0;font-size:13px;color:#69738f;align-self:center;margin-right:auto}.button.danger{background:#d9778f;box-shadow:none}
.form-note{font-size:12px;color:#c26d8a;margin:0 0 10px}.form-note:empty{display:none}.journal-form-panel .button{width:100%}.journal-form-panel .button[disabled]{opacity:.6;cursor:default}
.memory-media .memory-image{display:block}.photo-pick{position:relative}.photo-pick input{display:block;position:absolute;width:1px;height:1px;opacity:0}.photo-pick:focus-within{outline:2px solid var(--accent)}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:#252b43;color:#fff;padding:11px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:20;max-width:calc(100vw - 30px)}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:850px){.cards-2{grid-template-columns:1fr}}
@media(max-width:460px){.brand-name{display:none}.brand{padding:2px 0}}
@media(max-width:740px){.cal-cell{min-height:58px;padding:3px;gap:3px}.cal-head div{font-size:9px;letter-spacing:.4px}.cal-chips{flex-direction:row;flex-wrap:wrap}.cal-chip{padding:2px 3px;font-size:13px}.cal-chip .t{display:none}.cal-list{display:block}.modal{padding:18px}.form-row{grid-template-columns:1fr}.section-head{gap:10px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="brand"><div class="logo" aria-hidden="true">✦</div><span class="brand-name">Daydream</span></div>
<div>
<div class="nav-label">YOUR SPACE</div>
<nav class="nav" id="nav" aria-label="Main"></nav>
</div>
<div class="side-bottom"><div class="mini-note"><strong>Make room for fun ✨</strong>Big plans, little plans, and everything in between—all in one place.</div></div>
</aside>
<main class="main">
<div class="topbar">
<div class="welcome" id="welcome"></div>
<div class="top-actions"><div class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" aria-label="Search your plans" placeholder="Search your plans..." autocomplete="off"></div></div>
</div>
<div id="view"></div>
<footer>Daydream · plan the moments you’ll remember</footer>
</main>
</div>
<div id="modalRoot"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
